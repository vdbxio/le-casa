; Optional: build with PlatformIO (the ESPHome install brings it along)
; instead of idf.py. `pio run -e esp32-c3 -t upload -t monitor`.
[platformio]
src_dir = main

[env]
platform = espressif32
framework = espidf
monitor_speed = 115200

[env:esp32]
board = esp32dev

[env:esp32-c3]
board = esp32-c3-devkitm-1

[env:esp32-s3]
board = esp32-s3-devkitc-1

[env:esp32-c6]
board = esp32-c6-devkitc-1

; Seeed XIAO ESP32C6: same chip, but its RF switch has to be switched on.
[env:xiao-c6]
board = esp32-c6-devkitc-1
board_upload.flash_size = 4MB
build_flags = -DDEMO_BOARD_XIAO_C6
