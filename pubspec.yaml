name: lecasa
description: "Le'Casa: a Bluetooth-first home automation dashboard for vans, boats and off-grid homes. No router, no Pi, no login."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  bluetooth_low_energy: ^6.2.1
  pointycastle: ^4.0.0
  shared_preferences: ^2.5.6
  geolocator: ^14.1.2
  hooks: ^2.2.0
  code_assets: ^2.1.0
  native_toolchain_c: ^0.19.5
  record: ^7.1.2
  ffi: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Generate the app icons and launch screens from assets/brand/ (both MIT).
  # Rerun after changing the logo: dart run flutter_launcher_icons &&
  # dart run flutter_native_splash:create
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  # Cactus's voice models (Apache-2.0), fetched by tool/fetch_voice.sh.
  assets:
    - assets/voice/
  fonts:
    # League Spartan, SIL Open Font License 1.1 (assets/fonts/OFL.txt).
    - family: LeagueSpartan
      fonts:
        - asset: assets/fonts/LeagueSpartan-Regular.ttf
          weight: 400
        - asset: assets/fonts/LeagueSpartan-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/LeagueSpartan-Bold.ttf
          weight: 700
    # Clock faces. JetBrains Mono and DM Serif Display, both SIL Open Font
    # License 1.1 (assets/fonts/OFL-*.txt).
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Variable.ttf
    - family: DMSerifDisplay
      fonts:
        - asset: assets/fonts/DMSerifDisplay-Regular.ttf

flutter_launcher_icons:
  image_path: assets/brand/icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#F2F5F2"
  adaptive_icon_foreground: assets/brand/icon_foreground.png
  adaptive_icon_monochrome: assets/brand/icon_foreground.png
  min_sdk_android: 24

flutter_native_splash:
  color: "#F2F5F2"
  image: assets/brand/splash.png
  color_dark: "#090D0B"
  image_dark: assets/brand/splash_dark.png
  android_12:
    color: "#F2F5F2"
    image: assets/brand/icon_foreground.png
    color_dark: "#090D0B"
    image_dark: assets/brand/icon_foreground_dark.png
  fullscreen: true
